<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zufalls-Haiku</title>

<style>

body{
    margin:0;
    padding:20px;
    background:#f5f5f5;
    font-family:Arial,sans-serif;
    text-align:center;
}

.ebooklink{
    margin-bottom:15px;
    font-size:14px;
}

.ebooklink a{
    color:#666;
    text-decoration:none;
}

.ebooklink a:hover{
    text-decoration:underline;
}

#haikuBild{
    max-width:95%;
    max-height:85vh;
    box-shadow:0 0 20px rgba(0,0,0,0.2);
}

button{
    margin-top:25px;
    padding:12px 25px;
    border:none;
    border-radius:6px;
    background:#a00000;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#800000;
}

.info{
    margin-top:15px;
    color:#666;
    font-size:14px;
}

</style>

</head>

<body>

<div class="ebooklink">
    <a href="https://www.epubli.com/?s=Haiku-Gedichte+Pascal+Anna" target="_blank">
        Zur vollständigen Haiku-Sammlung von Pascal Anna
    </a>
</div>

<img id="haikuBild" alt="Haiku" onerror="neuesHaiku()">

<br>

<button onclick="neuesHaiku()">
Neues Haiku
</button>

<div class="info">
Ein zufälliger Gedanke aus 129 Haiku-Gedichten.
</div>

<script>

const anzahl = 129;

function neuesHaiku(){

    const zufall =
        Math.floor(Math.random() * anzahl) + 1;

    const dateiname =
        "HAIKU" +
        String(zufall).padStart(3,"0") +
        ".png";

    document.getElementById("haikuBild").src =
        dateiname;

}

neuesHaiku();

</script>

</body>
</html>
